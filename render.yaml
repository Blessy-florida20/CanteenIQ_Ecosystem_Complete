# Render Deployment Configuration for CanteenIQ
services:
  - type: web
    name: canteeniq
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: |
      cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: NODE_VERSION
        value: 20
